<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gothic Water Channel</title>
<style>
  *{margin:0;padding:0;overflow:hidden}
  body{background:#8f959c}
  canvas{display:block}
  #info{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.4);font:12px/1.5 system-ui,sans-serif;pointer-events:none;text-align:center}
</style>
</head>
<body>
<div id="info">Gothic Water Channel — Three.js<br><span id="audioHint">clique para ativar o som da tempestade</span></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ═════════════════════════════════════════════
   0. PALETA / ATMOSFERA
   ═════════════════════════════════════════════ */
const FOG_COLOR   = new THREE.Color(0xa5abb1);
const FOG_DENSITY = 0.0110;

const SKY_ZENITH  = new THREE.Color(0x939aa1);
const SKY_HORIZON = new THREE.Color(0xb9bfc4);
const CLOUD_DARK  = new THREE.Color(0x767d86);
const CLOUD_LIGHT = new THREE.Color(0xccd1d6);

const WATER_DEEP    = new THREE.Color(0x22635d);
const WATER_SHALLOW = new THREE.Color(0x58b6a8);
const WATER_SCATTER = new THREE.Color(0x6fd6c0); // luz atravessando a crista
const WALL_COLOR    = new THREE.Color(0x2a2e35); // torres refletidas na água

/* ═════════════════════════════════════════════
   1. CORE
   ═════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = FOG_COLOR.clone();
scene.fog = new THREE.FogExp2(FOG_COLOR.getHex(), FOG_DENSITY);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.3, 900);
camera.position.set(0, 2.6, 30);

/* ═════════════════════════════════════════════
   2. UNIFORMS COMPARTILHADOS
   Os mesmos objetos vão para céu, água e chuva:
   atualizar um atualiza todos.
   ═════════════════════════════════════════════ */
const U = {
  uTime:       { value: 0 },
  uFlash:      { value: 0 },
  uStrikeDir:  { value: new THREE.Vector3(1, 0.5, 0).normalize() },
  uZenith:     { value: SKY_ZENITH },
  uHorizon:    { value: SKY_HORIZON },
  uCloudDark:  { value: CLOUD_DARK },
  uCloudLight: { value: CLOUD_LIGHT },
  uCloudCover: { value: 0.92 },
  uCloudSpeed: { value: 0.0045 },
  uFogColor:   { value: FOG_COLOR },
  uFogDensity: { value: FOG_DENSITY },
};

/* ═════════════════════════════════════════════
   3. LUZ
   ═════════════════════════════════════════════ */
scene.add(new THREE.AmbientLight(0x99a0a8, 0.72));
scene.add(new THREE.HemisphereLight(0xc4cad0, 0x33373d, 0.9));

const dirLight = new THREE.DirectionalLight(0xb2b8bf, 0.22);
dirLight.position.set(40, 90, 25);
scene.add(dirLight);

/* luz do relâmpago: reposicionada a cada descarga */
const flashLight = new THREE.DirectionalLight(0xcfdcff, 0);
scene.add(flashLight);
const flashAmbient = new THREE.AmbientLight(0xb9c8ee, 0);
scene.add(flashAmbient);

/* ═════════════════════════════════════════════
   4. GLSL COMPARTILHADO — ruído, nuvem, céu
   ═════════════════════════════════════════════ */
const NOISE_GLSL = `
  float hash21(vec2 p){
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }
  vec2 hash22(vec2 p){
    float n = hash21(p);
    return vec2(n, hash21(p + n * 17.13));
  }
  float vnoise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    float a = hash21(i);
    float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0));
    float d = hash21(i + vec2(1.0, 1.0));
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  }
  float fbm3(vec2 p){
    mat2 rot = mat2(1.6, 1.2, -1.2, 1.6);
    float v = 0.0, a = 0.5;
    for(int i = 0; i < 3; i++){ v += a * vnoise(p); p = rot * p; a *= 0.5; }
    return v;
  }
  float fbm5(vec2 p){
    mat2 rot = mat2(1.6, 1.2, -1.2, 1.6);
    float v = 0.0, a = 0.5;
    for(int i = 0; i < 5; i++){ v += a * vnoise(p); p = rot * p; a *= 0.5; }
    return v;
  }
`;

const SKY_UNIFORMS_GLSL = `
  uniform vec3  uZenith;
  uniform vec3  uHorizon;
  uniform vec3  uCloudDark;
  uniform vec3  uCloudLight;
  uniform float uCloudCover;
  uniform float uCloudSpeed;
  uniform float uFlash;
  uniform vec3  uStrikeDir;
`;

/* Nuvem: projeção do raio de visão numa camada plana + domain warp.
   `cheap` corta oitavas — a água usa a versão barata no reflexo. */
const SKY_GLSL = `
  float cloudField(vec3 dir, float t, bool cheap){
    float y = max(dir.y, 0.015);
    vec2 uv = dir.xz / (y + 0.20) * 0.28;
    uv += vec2(t * uCloudSpeed, t * uCloudSpeed * 0.55);
    if(cheap){
      vec2 q = vec2(fbm3(uv), fbm3(uv + vec2(4.7, 2.1)));
      return fbm3(uv + 1.4 * q);
    }
    vec2 q = vec2(fbm3(uv), fbm3(uv + vec2(4.7, 2.1)));
    vec2 r = vec2(fbm3(uv + 1.4 * q + vec2(1.7, 9.2)), fbm3(uv + 1.4 * q + vec2(8.3, 2.8)));
    return fbm5(uv + 1.6 * q + 0.6 * r);
  }

  vec3 skyColor(vec3 dir, float t, bool cheap){
    vec3 base = mix(uHorizon, uZenith, smoothstep(-0.18, 0.70, dir.y));

    float f = cloudField(dir, t, cheap);
    float dens = smoothstep(0.28, 0.80, f);

    /* nublado fechado: base escura, bordas claras */
    vec3 cloud = mix(uCloudLight, uCloudDark, dens);
    cloud += vec3(0.05) * (1.0 - smoothstep(0.28, 0.70, f));

    float horizonFade = smoothstep(-0.03, 0.28, dir.y);
    float amount = clamp(uCloudCover * smoothstep(0.10, 0.58, f + 0.22), 0.0, 1.0) * horizonFade;
    vec3 col = mix(base, cloud, amount);

    /* clarão do relâmpago difundido pela massa de nuvem */
    vec3 d2 = normalize(vec3(dir.x, max(dir.y, 0.0), dir.z));
    float aim = pow(max(dot(d2, uStrikeDir), 0.0), 5.0);
    col += vec3(0.70, 0.77, 1.0) * uFlash * (0.16 + aim * 1.8) * (0.30 + dens * 0.95);

    return col;
  }
`;

/* ═════════════════════════════════════════════
   5. ÁGUA — ondas de Gerstner
   Deslocamento horizontal + vertical: cristas
   agudas e vales largos, como onda real. As
   normais e o jacobiano (espuma) saem analíticos
   das derivadas, não de diferenças finitas.
   ═════════════════════════════════════════════ */
const CHOPPY = 0.85;
const WAVES = [
  { dir: [ 1.00,  0.25], steep: 0.17, len: 34.0 },
  { dir: [-0.70,  0.70], steep: 0.16, len: 21.0 },
  { dir: [ 0.30, -0.90], steep: 0.13, len: 13.0 },
  { dir: [ 0.90,  0.60], steep: 0.10, len:  7.5 },
  { dir: [-0.40, -0.90], steep: 0.08, len:  4.2 },
  { dir: [ 0.75, -0.45], steep: 0.06, len:  2.4 },
];

const waveUniform = WAVES.map(w => {
  const d = new THREE.Vector2(w.dir[0], w.dir[1]).normalize();
  return new THREE.Vector4(d.x, d.y, w.steep, w.len);
});

/* Gerstner compartilhado: água, espuma e a faixa
   molhada nas paredes usam exatamente a mesma onda */
const GERSTNER_GLSL = `
  #define WAVE_COUNT ${WAVES.length}
  uniform vec4  uWaves[WAVE_COUNT];
  uniform float uChoppy;

  vec3 gerstnerDisplace(vec2 basePos, float t){
    vec3 disp = vec3(0.0);
    for(int i = 0; i < WAVE_COUNT; i++){
      vec4 w = uWaves[i];
      vec2 d = normalize(w.xy);
      float steep = w.z * uChoppy;
      float k = 6.28318530718 / w.w;
      float c = sqrt(9.81 / k);
      float a = steep / k;
      float f = k * (dot(d, basePos) - c * t);
      disp += vec3(d.x * a * cos(f), a * sin(f), d.y * a * cos(f));
    }
    return disp;
  }
  float gerstnerHeight(vec2 basePos, float t){
    return gerstnerDisplace(basePos, t).y;
  }
`;

const waterVS = `
  uniform float uTime;
  ${GERSTNER_GLSL}

  varying vec3  vWorldPos;
  varying vec3  vNormal;
  varying float vFoam;
  varying float vHeight;

  void main(){
    vec3 base = (modelMatrix * vec4(position, 1.0)).xyz;
    vec3 p = base;
    vec3 tangent  = vec3(1.0, 0.0, 0.0);
    vec3 binormal = vec3(0.0, 0.0, 1.0);

    for(int i = 0; i < WAVE_COUNT; i++){
      vec4 w = uWaves[i];
      vec2 d = normalize(w.xy);
      float steep = w.z * uChoppy;
      float k = 6.28318530718 / w.w;
      float c = sqrt(9.81 / k);        // dispersão de águas profundas
      float a = steep / k;
      float f = k * (dot(d, base.xz) - c * uTime);
      float cf = cos(f), sf = sin(f);

      p += vec3(d.x * a * cf, a * sf, d.y * a * cf);

      tangent  += vec3(-d.x * d.x * steep * sf,  d.x * steep * cf, -d.x * d.y * steep * sf);
      binormal += vec3(-d.x * d.y * steep * sf,  d.y * steep * cf, -d.y * d.y * steep * sf);
    }

    vNormal = normalize(cross(binormal, tangent));

    /* jacobiano < 1 => superfície comprimida => espuma de quebra */
    float J = tangent.x * binormal.z - tangent.z * binormal.x;
    vFoam = 1.0 - smoothstep(0.35, 0.92, J);

    vHeight   = p.y - base.y;
    vWorldPos = p;
    gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
  }
`;

const waterFS = `
  uniform float uTime;
  uniform vec3  uDeep;
  uniform vec3  uShallow;
  uniform vec3  uScatter;
  uniform vec3  uWallColor;
  uniform vec3  uFogColor;
  uniform float uFogDensity;
  uniform float uRainIntensity;
  ${SKY_UNIFORMS_GLSL}

  varying vec3  vWorldPos;
  varying vec3  vNormal;
  varying float vFoam;
  varying float vHeight;

  ${NOISE_GLSL}
  ${SKY_GLSL}

  /* marulho fino de vento — abaixo do tamanho do triângulo */
  vec2 windChopGrad(vec2 p, float t){
    vec2 g = vec2(0.0);
    vec2 d1 = normalize(vec2( 0.80,  0.60)); float f1 = 1.9; float a1 = 0.018;
    vec2 d2 = normalize(vec2(-0.50,  0.87)); float f2 = 3.1; float a2 = 0.011;
    vec2 d3 = normalize(vec2( 0.95, -0.31)); float f3 = 5.3; float a3 = 0.006;
    vec2 d4 = normalize(vec2(-0.20, -0.98)); float f4 = 8.7; float a4 = 0.004;
    g += d1 * (a1 * f1) * cos(dot(p, d1) * f1 + t * 2.4);
    g += d2 * (a2 * f2) * cos(dot(p, d2) * f2 - t * 3.2);
    g += d3 * (a3 * f3) * cos(dot(p, d3) * f3 + t * 4.1);
    g += d4 * (a4 * f4) * cos(dot(p, d4) * f4 - t * 5.4);
    return g;
  }

  /* ruído fractal derivado: quebra a coerência dos senos,
     sem ele a superfície vira listras paralelas e manchas chapadas */
  vec2 fbmGrad(vec2 p, float t, float scale, float speed){
    float e = 0.35 / scale;
    vec2 q = p * scale + vec2(t * speed, -t * speed * 0.7);
    float h0 = fbm3(q);
    float hx = fbm3(q + vec2(e, 0.0));
    float hy = fbm3(q + vec2(0.0, e));
    return vec2(hx - h0, hy - h0) * scale / e;
  }

  /* anéis de gota: cada célula solta um anel que expande e some */
  vec2 rainRingGrad(vec2 p, float t){
    vec2 g = vec2(0.0);
    vec2 sp = p * 0.9;
    vec2 ip = floor(sp);
    vec2 fp = fract(sp);
    for(int y = -1; y <= 1; y++){
      for(int x = -1; x <= 1; x++){
        vec2 o = vec2(float(x), float(y));
        vec2 rnd = hash22(ip + o);
        vec2 center = o + rnd;
        float phase = fract(t * 1.15 + rnd.x * 6.3 + rnd.y * 2.7);
        vec2 dv = fp - center;
        float d = length(dv) + 1e-4;
        float r = phase * 0.62;
        float amp = (1.0 - phase) * exp(-abs(d - r) * 16.0) * exp(-d * 2.2);
        g += (dv / d) * cos((d - r) * 46.0) * amp;
      }
    }
    return g * 0.075;
  }

  void main(){
    vec3  V    = normalize(cameraPosition - vWorldPos);
    float dist = length(cameraPosition - vWorldPos);
    vec3  N    = normalize(vNormal);

    /* LOD de normal: detalhe some com a distância (anti-aliasing) */
    float detail = exp(-dist * 0.018);
    vec2 g = windChopGrad(vWorldPos.xz, uTime) * (0.22 + 2.4 * detail);
    g += fbmGrad(vWorldPos.xz, uTime, 0.55, 0.25) * (0.05 + 0.22 * detail);
    g += fbmGrad(vWorldPos.xz, uTime, 2.10, 0.55) * (0.02 + 0.09 * detail);
    if(dist < 75.0){
      g += rainRingGrad(vWorldPos.xz, uTime) * uRainIntensity * detail;
    }
    N = normalize(N + vec3(-g.x, 0.0, -g.y));
    N = normalize(mix(N, vec3(0.0, 1.0, 0.0), smoothstep(70.0, 280.0, dist) * 0.7));

    /* reflexo do céu nublado */
    vec3 R = reflect(-V, N);
    R.y = max(R.y, 0.012);
    vec3 refl = skyColor(R, uTime, true);

    /* aproximação das torres escuras refletidas junto às margens */
    float grazing = pow(1.0 - abs(R.y), 3.0);
    float nearWall = smoothstep(10.0, 26.0, abs(vWorldPos.x));
    refl = mix(refl, uWallColor, nearWall * grazing * 0.40);

    float F = 0.03 + 0.97 * pow(1.0 - max(dot(V, N), 0.0), 5.0);

    /* corpo: vale escuro, crista clara */
    float hN = clamp(vHeight * 0.55 + 0.5, 0.0, 1.0);
    vec3 body = mix(uDeep, uShallow, hN);

    /* irradiância do domo encoberto: faces viradas para cima recebem mais */
    vec3 irradiance = mix(uHorizon, uZenith, 0.45);
    body *= (0.42 + 0.72 * max(N.y, 0.0)) * (0.55 + irradiance);

    /* dispersão subsuperficial: luz difusa passando pela crista */
    vec3 L = normalize(vec3(0.25, 0.72, 0.55));
    float sss = pow(max(dot(V, -L) * 0.5 + 0.5, 0.0), 3.0) * clamp(vHeight * 0.8, 0.0, 1.0);
    body += uScatter * sss * 0.5;

    vec3 color = mix(body, refl, clamp(F * 1.30, 0.0, 1.0));

    /* especular GGX: duas fontes largas simulam a claraboia encoberta */
    float rough = mix(0.045, 0.20, smoothstep(0.0, 100.0, dist));
    float a2 = rough * rough * rough * rough;
    vec3 spec = vec3(0.0);
    for(int i = 0; i < 2; i++){
      vec3 Li = i == 0 ? L : normalize(vec3(-0.45, 0.80, -0.30));
      vec3 H = normalize(Li + V);
      float ndh = max(dot(N, H), 0.0);
      float den = ndh * ndh * (a2 - 1.0) + 1.0;
      spec += vec3(1.0, 0.99, 0.96) * min(a2 / (3.14159265 * den * den) * 0.10, 6.0) * (i == 0 ? 1.0 : 0.55);
    }
    color += spec * (0.6 + uFlash * 5.0);

    /* espuma: jacobiano modulado por textura para não ficar chapada */
    float foamTex = fbm3(vWorldPos.xz * 0.6 + uTime * 0.06);
    float foam = clamp(vFoam * (0.25 + foamTex * 1.35), 0.0, 1.0);
    foam *= 0.35 + 0.65 * smoothstep(-0.2, 0.6, vHeight);
    color = mix(color, vec3(0.88, 0.93, 0.94), foam * 0.9);

    /* superfície acesa pelo relâmpago */
    color += vec3(0.50, 0.58, 0.78) * uFlash * 0.22;

    float fogF = 1.0 - exp(-uFogDensity * uFogDensity * dist * dist);
    vec3 fogLit = uFogColor + vec3(0.55, 0.62, 0.82) * uFlash * 0.40;
    color = mix(color, fogLit, clamp(fogF, 0.0, 1.0));

    gl_FragColor = vec4(color, 1.0);
  }
`;

const waterGeo = new THREE.PlaneGeometry(520, 520, 384, 384);
waterGeo.rotateX(-Math.PI / 2);

const waterMat = new THREE.ShaderMaterial({
  uniforms: Object.assign({}, U, {
    uWaves:         { value: waveUniform },
    uChoppy:        { value: CHOPPY },
    uDeep:          { value: WATER_DEEP },
    uShallow:       { value: WATER_SHALLOW },
    uScatter:       { value: WATER_SCATTER },
    uWallColor:     { value: WALL_COLOR },
    uRainIntensity: { value: 1.0 },
  }),
  vertexShader: waterVS,
  fragmentShader: waterFS,
});

const water = new THREE.Mesh(waterGeo, waterMat);
water.frustumCulled = false;
scene.add(water);

/* mesma soma de Gerstner em JS, para a câmera boiar */
function surfaceHeight(x, z, t) {
  let y = 0;
  for (const w of WAVES) {
    const len = Math.hypot(w.dir[0], w.dir[1]);
    const dx = w.dir[0] / len, dz = w.dir[1] / len;
    const k = (Math.PI * 2) / w.len;
    const c = Math.sqrt(9.81 / k);
    const a = (w.steep * CHOPPY) / k;
    y += a * Math.sin(k * (dx * x + dz * z - c * t));
  }
  return y;
}

/* ═════════════════════════════════════════════
   6. CÉU NUBLADO
   ═════════════════════════════════════════════ */
const skyVS = `
  varying vec3 vDir;
  void main(){
    vDir = position;
    vec4 pos = projectionMatrix * mat4(mat3(viewMatrix)) * vec4(position, 1.0);
    gl_Position = pos.xyww;
  }
`;

const skyFS = `
  uniform float uTime;
  ${SKY_UNIFORMS_GLSL}
  varying vec3 vDir;
  ${NOISE_GLSL}
  ${SKY_GLSL}
  void main(){
    gl_FragColor = vec4(skyColor(normalize(vDir), uTime, false), 1.0);
  }
`;

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(500, 32, 16),
  new THREE.ShaderMaterial({
    uniforms: Object.assign({}, U),
    vertexShader: skyVS,
    fragmentShader: skyFS,
    side: THREE.BackSide,
    depthWrite: false,
  })
);
sky.frustumCulled = false;
sky.renderOrder = -1;
scene.add(sky);

/* ═════════════════════════════════════════════
   7. CHUVA — quads instanciados na GPU
   Cada gota é um quad alinhado ao vetor
   velocidade (rastro de motion blur), com núcleo
   claro e cauda que some. Posição é integrada no
   shader e embrulhada em torno da câmera, então
   nada é atualizado pela CPU.
   ═════════════════════════════════════════════ */
const rainVS = `
  uniform float uTime;
  uniform vec3  uCamPos;
  uniform vec2  uWind;
  uniform vec3  uBox;
  uniform float uWidth;

  attribute vec3  aOrigin;
  attribute float aSpeed;
  attribute float aLength;
  attribute float aOpacity;

  varying vec2  vUv;
  varying float vAlpha;
  varying float vDist;

  void main(){
    vec3 p = aOrigin;
    p.y -= aSpeed * uTime;
    p.xz += uWind * uTime * aSpeed * 0.05;

    /* caixa de chuva embrulhada em torno da câmera */
    vec3 h = uBox * 0.5;
    p.x = mod(p.x - uCamPos.x + h.x, uBox.x) - h.x + uCamPos.x;
    p.z = mod(p.z - uCamPos.z + h.z, uBox.z) - h.z + uCamPos.z;
    p.y = mod(p.y, uBox.y);

    vec3 vel   = normalize(vec3(uWind.x * 0.05, -1.0, uWind.y * 0.05));
    vec3 toCam = uCamPos - p;
    float d    = length(toCam);
    vec3 vdir  = toCam / max(d, 1e-4);

    vec3 side = cross(vel, vdir);
    float sl  = length(side);
    side = sl > 1e-4 ? side / sl : vec3(1.0, 0.0, 0.0);

    /* rastro mais longo quanto mais rápida a gota */
    float len = aLength * (0.7 + aSpeed * 0.02);
    vec3 wp = p + side * (position.x * uWidth) - vel * (position.y * len);

    vUv   = vec2(position.x + 0.5, position.y);
    vDist = d;

    float nearFade = smoothstep(0.5, 3.5, d);
    float farFade  = 1.0 - smoothstep(uBox.x * 0.26, uBox.x * 0.5, d);
    vAlpha = aOpacity * nearFade * farFade;

    gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
  }
`;

const rainFS = `
  uniform vec3  uRainColor;
  uniform vec3  uFogColor;
  uniform float uFogDensity;
  uniform float uFlash;

  varying vec2  vUv;
  varying float vAlpha;
  varying float vDist;

  void main(){
    /* seção transversal suave: sem borda dura de linha */
    float section = 1.0 - abs(vUv.x * 2.0 - 1.0);
    section = pow(section, 1.5);

    /* cabeça brilhante, cauda que dissolve */
    float head  = smoothstep(0.0, 0.12, vUv.y);
    float tail  = pow(1.0 - vUv.y, 0.85);
    float along = mix(0.35, 1.0, head) * tail;

    float a = vAlpha * section * along;
    if(a < 0.004) discard;

    vec3 col = uRainColor * (1.0 + uFlash * 2.6);

    float fogF = 1.0 - exp(-uFogDensity * uFogDensity * vDist * vDist);
    col = mix(col, uFogColor, fogF * 0.85);
    a  *= (1.0 - fogF * 0.7);

    gl_FragColor = vec4(col, a);
  }
`;

function createRainLayer(opts) {
  const { count, box, width, speed, length, opacity, color } = opts;

  const geo = new THREE.InstancedBufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(
    [-0.5, 0, 0,  0.5, 0, 0,  0.5, 1, 0,  -0.5, 1, 0], 3));
  geo.setIndex([0, 1, 2, 0, 2, 3]);

  const origins   = new Float32Array(count * 3);
  const speeds    = new Float32Array(count);
  const lengths   = new Float32Array(count);
  const opacities = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    origins[i * 3]     = (Math.random() - 0.5) * box.x;
    origins[i * 3 + 1] = Math.random() * box.y;
    origins[i * 3 + 2] = (Math.random() - 0.5) * box.z;
    speeds[i]    = speed[0] + Math.random() * (speed[1] - speed[0]);
    lengths[i]   = length[0] + Math.random() * (length[1] - length[0]);
    opacities[i] = opacity * (0.55 + Math.random() * 0.75);
  }

  geo.setAttribute('aOrigin',  new THREE.InstancedBufferAttribute(origins, 3));
  geo.setAttribute('aSpeed',   new THREE.InstancedBufferAttribute(speeds, 1));
  geo.setAttribute('aLength',  new THREE.InstancedBufferAttribute(lengths, 1));
  geo.setAttribute('aOpacity', new THREE.InstancedBufferAttribute(opacities, 1));
  geo.instanceCount = count;

  const mat = new THREE.ShaderMaterial({
    uniforms: Object.assign({}, U, {
      uCamPos:    { value: new THREE.Vector3() },
      uWind:      { value: new THREE.Vector2(3.0, 0.6) },
      uBox:       { value: new THREE.Vector3(box.x, box.y, box.z) },
      uWidth:     { value: width },
      uRainColor: { value: new THREE.Color(color) },
    }),
    vertexShader: rainVS,
    fragmentShader: rainFS,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  mesh.renderOrder = 10;
  scene.add(mesh);
  return mesh;
}

function spawnBolt(azimuth, camPos) {
  const dist = 130 + Math.random() * 130;
  const pts = [];
  let x = camPos.x + Math.cos(azimuth) * dist;
  let z = camPos.z + Math.sin(azimuth) * dist;
  let y = 145;
  const segs = 24;
  const spine = [];
  for (let i = 0; i <= segs; i++) {
    spine.push(new THREE.Vector3(x, y, z));
    y -= 145 / segs;
    x += (Math.random() - 0.5) * 11;
    z += (Math.random() - 0.5) * 11;
  }
  for (let i = 0; i < spine.length - 1; i++) pts.push(spine[i], spine[i + 1]);

  /* ramificações */
  const branches = 2 + Math.floor(Math.random() * 3);
  for (let b = 0; b < branches; b++) {
    const i = 3 + Math.floor(Math.random() * (spine.length - 8));
    let p = spine[i].clone();
    const dir = new THREE.Vector3((Math.random() - 0.5) * 1.8, -1, (Math.random() - 0.5) * 1.8).normalize();
    const steps = 3 + Math.floor(Math.random() * 4);
    for (let s = 0; s < steps; s++) {
      const q = p.clone().addScaledVector(dir, 7 + Math.random() * 12);
      q.x += (Math.random() - 0.5) * 7;
      q.z += (Math.random() - 0.5) * 7;
      pts.push(p.clone(), q.clone());
      p = q;
    }
  }

  const line = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), boltMat);
  line.frustumCulled = false;
  line.userData.life = 0.32 + Math.random() * 0.2;
  line.userData.age = 0;
  boltGroup.add(line);
}

const storm = {
  pulses: [],
  nextStrike: 2.5 + Math.random() * 5,
  timer: 0,
  flash: 0,
};

function triggerStrike(camPos) {
  const distance = 220 + Math.random() * 3200;              // metros
  const closeness = THREE.MathUtils.clamp(1 - distance / 3400, 0, 1);
  const amp = 0.28 + closeness * 1.0;

  const az = Math.random() * Math.PI * 2;
  U.uStrikeDir.value.set(Math.cos(az) * 0.62, 0.5, Math.sin(az) * 0.62).normalize();

  /* perfil de descarga: golpe principal + retornos */
  storm.pulses.length = 0;
  const n = 2 + Math.floor(Math.random() * 4);
  let offset = 0;
  for (let i = 0; i < n; i++) {
    storm.pulses.push({
      t: offset,
      a: amp * (i === 0 ? 1.0 : 0.3 + Math.random() * 0.65),
      tau: 0.045 + Math.random() * 0.10,
    });
    offset += 0.035 + Math.random() * 0.14;
  }
  storm.timer = 0;

  flashLight.position.set(
    camPos.x + Math.cos(az) * 160, 130, camPos.z + Math.sin(az) * 160
  );
  flashLight.target.position.set(camPos.x, 0, camPos.z);
  flashLight.target.updateMatrixWorld();

  if (closeness > 0.42) spawnBolt(az, camPos);
  playThunder(distance / 343, closeness);

  storm.nextStrike = 2.0 + Math.random() * 9.0;
}

function updateStorm(dt, camPos) {
  storm.timer += dt;

  if (storm.pulses.length === 0 && storm.timer > storm.nextStrike) {
    triggerStrike(camPos);
  }

  let f = 0;
  let alive = false;
  for (const p of storm.pulses) {
    const age = storm.timer - p.t;
    if (age < 0) { alive = true; continue; }
    const v = p.a * Math.exp(-age / p.tau);
    if (v > 0.002) alive = true;
    f += v;
  }
  if (!alive) storm.pulses.length = 0;

  storm.flash = Math.min(f, 1.25);
  U.uFlash.value = storm.flash;

  flashLight.intensity = storm.flash * 5.0;
  flashAmbient.intensity = storm.flash * 1.1;

  /* raios visíveis somem junto com o clarão */
  for (let i = boltGroup.children.length - 1; i >= 0; i--) {
    const b = boltGroup.children[i];
    b.userData.age += dt;
    if (b.userData.age > b.userData.life) {
      boltGroup.remove(b);
      b.geometry.dispose();
    }
  }
  boltMat.opacity = Math.min(storm.flash * 0.9, 0.95);
}

/* ── Áudio: trovão sintetizado + leito de chuva ── */
let audioCtx = null;
let rainBed = null;

function ensureAudio() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audioCtx = new Ctx();
    startRainBed();
    const hint = document.getElementById('audioHint');
    if (hint) hint.textContent = 'som ativo';
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
window.addEventListener('pointerdown', ensureAudio);
window.addEventListener('keydown', ensureAudio);

function noiseBuffer(seconds, brown) {
  const sr = audioCtx.sampleRate;
  const buf = audioCtx.createBuffer(1, Math.floor(sr * seconds), sr);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < d.length; i++) {
    const w = Math.random() * 2 - 1;
    if (brown) { last = (last + 0.022 * w) / 1.022; d[i] = last * 3.4; }
    else d[i] = w;
  }
  return buf;
}

function startRainBed() {
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuffer(4, false);
  src.loop = true;

  const hp = audioCtx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 700;
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 5200;

  const gain = audioCtx.createGain();
  gain.gain.value = 0.055;

  src.connect(hp); hp.connect(lp); lp.connect(gain); gain.connect(audioCtx.destination);
  src.start();
  rainBed = gain;
}

function playThunder(delay, closeness) {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const dur = 2.6 + closeness * 3.0;

  const buf = noiseBuffer(dur, true);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) {
    const x = i / d.length;
    /* envelope: rolo longo + ondulações; estalo só se for perto */
    let env = Math.exp(-x * 2.1) * (0.55 + 0.45 * Math.sin(x * 26.0) * Math.exp(-x * 5.0));
    if (closeness > 0.6) env += Math.exp(-x * 95.0) * (closeness - 0.6) * 3.0;
    d[i] *= env;
  }

  const src = audioCtx.createBufferSource();
  src.buffer = buf;

  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(180 + closeness * 1700, t0);
  lp.frequency.exponentialRampToValueAtTime(85, t0 + dur);

  const gain = audioCtx.createGain();
  gain.gain.value = 0.12 + closeness * 0.55;

  src.connect(lp); lp.connect(gain); gain.connect(audioCtx.destination);
  src.start(t0);
}

const STONE_MAT = new THREE.MeshStandardMaterial({

/* Pedra procedural injetada no MeshStandardMaterial:
   aparelho de blocos com fiadas alternadas, grão,
   escorrido de chuva e faixa molhada que sobe e
   desce junto com a onda que bate na parede. */
STONE_MAT.onBeforeCompile = (shader) => {
  shader.uniforms.uTime   = U.uTime;
  shader.uniforms.uWaves  = waterMat.uniforms.uWaves;
  shader.uniforms.uChoppy = waterMat.uniforms.uChoppy;

  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', '#include <common>\n varying vec3 vWPos;')
    .replace('#include <begin_vertex>',
      '#include <begin_vertex>\n vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');

  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', `
      #include <common>
      varying vec3 vWPos;
      uniform float uTime;
      ${NOISE_GLSL}
      ${GERSTNER_GLSL}
    `)
    .replace('#include <roughnessmap_fragment>', `
      #include <roughnessmap_fragment>

      /* coordenada horizontal contínua ao longo da fachada */
      float faceH = vWPos.x + vWPos.z;

      float rowF = vWPos.y * 1.15;
      float row  = floor(rowF);
      float bond = mod(row, 2.0) * 0.5;          // fiada alternada
      float colF = faceH * 0.62 + bond;

      float blockRnd = hash21(vec2(floor(colF), row));
      float grain    = fbm3(vec2(faceH * 3.1, vWPos.y * 3.1));

      float fr = fract(rowF);
      float fc = fract(colF);
      float jointH = smoothstep(0.0, 0.055, fr) * (1.0 - smoothstep(0.055, 0.13, fr));
      float jointV = smoothstep(0.0, 0.05,  fc) * (1.0 - smoothstep(0.05,  0.11, fc));
      float joint  = max(jointH, jointV * 0.75);

      float tone = 0.84 + 0.28 * blockRnd + 0.18 * (grain - 0.5);
      tone *= 1.0 - 0.30 * joint;

      /* escorrido vertical de chuva/limo */
      float streak = fbm3(vec2(faceH * 2.7, vWPos.y * 0.07));
      tone *= mix(1.0, 0.72, smoothstep(0.42, 0.88, streak));

      /* base mais suja que o topo */
      tone *= mix(0.70, 1.0, smoothstep(0.0, 10.0, vWPos.y));

      diffuseColor.rgb *= tone;

      /* faixa molhada acompanhando a onda local */
      if(vWPos.y < 7.0){
        float wh  = gerstnerHeight(vWPos.xz, uTime);
        float wet = 1.0 - smoothstep(wh - 0.5, wh + 1.7, vWPos.y);
        diffuseColor.rgb *= mix(1.0, 0.38, wet);
        roughnessFactor = mix(roughnessFactor, 0.10, wet);
      }
    `);
};

/* halo suave em volta de cada janela acesa */
const HALO_MAT = new THREE.ShaderMaterial({

    attribute vec3 color;

    void main(){
      vUv = uv;
      vTint = color;

    }
  `,
  fragmentShader: `
    uniform float uFogDensity;
    varying vec2 vUv;
    varying vec3 vTint;
    varying float vDist;
    void main(){
      vec2 d = (vUv - 0.5) * 2.0;
      float r = length(vec2(d.x, d.y * 0.8));
      float a = pow(max(1.0 - r, 0.0), 2.6);
      float fog = 1.0 - exp(-uFogDensity * uFogDensity * vDist * vDist);
      gl_FragColor = vec4(vTint * a * (1.0 - fog * 0.75), 1.0);

});

/* ── ESPUMA NA PAREDE ──
   Anel de malha em volta da base cujos vértices
   sobem e descem com a MESMA onda da água, com
   máscara fractal animada: nada de bloco branco. */
const washVS = `
  uniform float uTime;
  ${GERSTNER_GLSL}
  attribute float aOut;
  varying float vOut;
  varying float vWave;
  varying vec3  vWorld;
  varying float vDist;

  void main(){
    vec3 wp = (modelMatrix * vec4(position, 1.0)).xyz;
    vec3 disp = gerstnerDisplace(wp.xz, uTime);
    /* +0.07 tira a espuma do mesmo plano da água,
       senão ela perde o teste de profundidade */
    wp.y  += disp.y + 0.07;
    wp.xz += disp.xz * 0.45;

    vOut   = aOut;
    vWave  = disp.y;
    vWorld = wp;
    vDist  = length(cameraPosition - wp);
    gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
  }
`;

const washFS = `
  uniform float uTime;
  uniform vec3  uFogColor;
  uniform float uFogDensity;
  uniform float uFlash;
  varying float vOut;
  varying float vWave;
  varying vec3  vWorld;
  varying float vDist;
  ${NOISE_GLSL}

  void main(){
    /* duas escalas de turbulência em sentidos opostos */
    float n1 = fbm3(vWorld.xz * 1.15 - uTime * 0.20);
    float n2 = fbm3(vWorld.xz * 3.40 + uTime * 0.42);

    /* densa junto à parede, dissolvendo para fora */
    float band  = 1.0 - smoothstep(0.0, 0.95, vOut);
    /* a crista empurra a espuma para longe da parede */
    float runup = smoothstep(-0.5, 0.9, vWave);

    float mask = band * (0.55 + 1.15 * runup);
    float a = smoothstep(0.16, 0.58, mask * (0.65 + 0.95 * n1) + 0.22 * n2 - 0.08);
    a *= 1.0 - smoothstep(0.68, 1.0, vOut);

    if(a < 0.01) discard;

    vec3 col = mix(vec3(0.90, 0.94, 0.95), vec3(0.72, 0.79, 0.82), 0.5 - 0.5 * n2);
    col += vec3(0.5, 0.56, 0.7) * uFlash * 0.5;

    float fog = 1.0 - exp(-uFogDensity * uFogDensity * vDist * vDist);
    col = mix(col, uFogColor, fog);
    gl_FragColor = vec4(col, a * (1.0 - fog * 0.6) * 0.92);
  }
`;

/* respingo vertical: sobe pela parede quando a crista bate */
const sprayVS = `
  uniform float uTime;
  ${GERSTNER_GLSL}
  attribute float aUp;
  varying float vUp;
  varying float vWave;
  varying vec3  vWorld;
  varying float vDist;

  void main(){
    vec3 wp = (modelMatrix * vec4(position, 1.0)).xyz;
    float wh = gerstnerHeight(wp.xz, uTime);
    wp.y = wh - 0.7 + aUp * 3.0;

    vUp    = aUp;
    vWave  = wh;
    vWorld = wp;
    vDist  = length(cameraPosition - wp);
    gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
  }
`;

const sprayFS = `
  uniform float uTime;
  uniform vec3  uFogColor;
  uniform float uFogDensity;
  uniform float uFlash;
  varying float vUp;
  varying float vWave;
  varying vec3  vWorld;
  varying float vDist;
  ${NOISE_GLSL}

  void main(){
    float n = fbm3(vec2(vWorld.x + vWorld.z, vWorld.y) * 1.8 - uTime * 0.55);
    float rise = smoothstep(-0.35, 1.0, vWave);          // só com crista alta
    float fall = pow(1.0 - vUp, 2.0);                    // some para cima
    float a = smoothstep(0.22, 0.66, fall * rise * (0.6 + 1.1 * n));
    if(a < 0.01) discard;

    vec3 col = vec3(0.90, 0.94, 0.95) + vec3(0.5, 0.56, 0.7) * uFlash * 0.5;
    float fog = 1.0 - exp(-uFogDensity * uFogDensity * vDist * vDist);
    col = mix(col, uFogColor, fog);
    gl_FragColor = vec4(col, a * (1.0 - fog * 0.6) * 0.8);
  }
`;

const WASH_MAT = new THREE.ShaderMaterial({

/* contorno do retângulo com cantos arredondados:
   cada amostra carrega sua normal para fora */
function baseOutline(w, d) {
  const hw = w / 2, hd = d / 2;
  const pts = [];
  const push = (x, z, nx, nz) => pts.push({ x, z, nx, nz });

  const side = (x0, z0, x1, z1, nx, nz) => {
    const len = Math.hypot(x1 - x0, z1 - z0);
    const n = Math.max(2, Math.round(len / 0.7));
    for (let i = 0; i < n; i++) {
      const t = i / n;
      push(x0 + (x1 - x0) * t, z0 + (z1 - z0) * t, nx, nz);
    }
  };
  const corner = (cx, cz, a0, a1) => {
    const n = 5;
    for (let i = 0; i < n; i++) {
      const a = a0 + (a1 - a0) * (i / n);
      push(cx, cz, Math.cos(a), Math.sin(a));
    }
  };

  const H = Math.PI / 2;
  side(-hw, hd, hw, hd, 0, 1);      corner( hw,  hd,  H, 0);
  side(hw, hd, hw, -hd, 1, 0);      corner( hw, -hd,  0, -H);
  side(hw, -hd, -hw, -hd, 0, -1);   corner(-hw, -hd, -H, -Math.PI);
  side(-hw, -hd, -hw, hd, -1, 0);   corner(-hw,  hd,  Math.PI, H);
  return pts;
}

function buildWashGeometry(w, d) {
  const outline = baseOutline(w, d);
  const rings = 7;
  const outer = 3.2;
  const n = outline.length;

  const pos = [];
  const out = [];
  for (let j = 0; j <= rings; j++) {
    const tj = j / rings;
    const r = Math.pow(tj, 1.35) * outer;
    for (const p of outline) {
      pos.push(p.x + p.nx * r, 0, p.z + p.nz * r);
      out.push(tj);
    }
  }

  const idx = [];
  for (let j = 0; j < rings; j++) {
    for (let i = 0; i < n; i++) {
      const i2 = (i + 1) % n;
      const a = j * n + i, b = j * n + i2;
      const c = (j + 1) * n + i, e = (j + 1) * n + i2;
      idx.push(a, c, e, a, e, b);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('aOut', new THREE.Float32BufferAttribute(out, 1));
  geo.setIndex(idx);
  return geo;
}

function buildSprayGeometry(w, d) {
  const outline = baseOutline(w, d);
  const n = outline.length;
  const pos = [];
  const up = [];
  for (let lvl = 0; lvl < 2; lvl++) {
    for (const p of outline) {
      pos.push(p.x + p.nx * 0.35, 0, p.z + p.nz * 0.35);
      up.push(lvl);
    }
  }
  const idx = [];
  for (let i = 0; i < n; i++) {
    const i2 = (i + 1) % n;
    idx.push(i, n + i, n + i2, i, n + i2, i2);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('aUp', new THREE.Float32BufferAttribute(up, 1));
  geo.setIndex(idx);
  return geo;
}

/* claras de propósito: o pipeline converte sRGB → linear,
   então um cinza escuro aqui vira quase preto na tela */
const C_BODY   = new THREE.Color(0x5c626c);
const C_SPIRE  = new THREE.Color(0x4d535c);
const C_BAND   = new THREE.Color(0x666c75);
const C_ROOF   = new THREE.Color(0x555b64);
const C_PIER   = new THREE.Color(0x646a74); // contraforte pega mais luz
const C_BASE   = new THREE.Color(0x4a505a); // plinto, sempre molhado
const C_REVEAL = new THREE.Color(0x2b2f36); // fundo do nicho da janela
const C_HALO   = new THREE.Color(0xa8611e); // brilho somado em volta da janela
const C_OFF   = new THREE.Color(0x0d0f12);

/* ═════════════════════════════════════════════
   10. HELPERS
   ═════════════════════════════════════════════ */
function pushGeo(list, geo, matrix, colorFn) {
  const posAttr = geo.attributes.position;
  const colors = new Float32Array(posAttr.count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < posAttr.count; i++) {
    colorFn(c, posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i));
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.applyMatrix4(matrix);
  const nonIndexed = geo.toNonIndexed();
  geo.dispose();
  list.push(nonIndexed);
}

const flat = (color) => (c) => c.copy(color);

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ═════════════════════════════════════════════
   11. TORRE GÓTICA
   ═════════════════════════════════════════════ */
function lancetShape(w, h) {
  const shape = new THREE.Shape();
  const hw = w / 2;
  const shoulder = h - hw;
  shape.moveTo(-hw, 0);
  shape.lineTo(-hw, shoulder);
  shape.absarc(0, shoulder, hw, Math.PI, 0, false);
  shape.lineTo(hw, 0);
  shape.lineTo(-hw, 0);
  return new THREE.ShapeGeometry(shape, 8);
}

const WIN_TOP    = new THREE.Color(0xffd9a0);
const WIN_BOTTOM = new THREE.Color(0xff9a2e);
const windowColorFn = (h) => (c, x, y) =>
  c.copy(WIN_BOTTOM).lerp(WIN_TOP, THREE.MathUtils.clamp(y / h, 0, 1));

/* gablete triangular (frontão) para os topos chapados */
function gableGeometry(w, h, d) {
  const shape = new THREE.Shape();
  shape.moveTo(-w / 2, 0);
  shape.lineTo(w / 2, 0);
  shape.lineTo(0, h);
  shape.lineTo(-w / 2, 0);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: d, bevelEnabled: false });
  geo.translate(0, 0, -d / 2);
  return geo;
}

function buildTower(cfg, rng) {
  const stoneGeos = [];
  const winGeos = [];
  const haloGeos = [];
  const m = new THREE.Matrix4();
  const { width, depth, height } = cfg;
  const halfW = width / 2;
  const halfD = depth / 2;

  /* ── plinto: base alargada que entra na água ── */
  const plinthH = 2.4;
  pushGeo(stoneGeos, new THREE.BoxGeometry(width + 0.7, plinthH, depth + 0.7),
    m.makeTranslation(0, plinthH / 2 - 1.2, 0), flat(C_BASE));
  pushGeo(stoneGeos, new THREE.BoxGeometry(width + 0.35, 0.3, depth + 0.35),
    m.makeTranslation(0, plinthH - 1.2, 0), flat(C_BAND));

  /* ── corpo ── */
  pushGeo(stoneGeos, new THREE.BoxGeometry(width, height, depth),
    m.makeTranslation(0, height / 2, 0), flat(C_BODY));

  /* ── contrafortes verticais: o relevo que faltava ──
     tiras salientes entre as colunas de janelas, com
     capitel piramidal logo abaixo da cornija */
  const cols = cfg.windowCols;
  const bCount = cols + 1;
  const bW = Math.min(0.55, width / (bCount * 2.0));
  const bDepth = 0.30;
  const bTop = height * 0.90;
  const bStepX = bCount > 1 ? (width * 0.90) / (bCount - 1) : 0;
  const bStepZ = bCount > 1 ? (depth * 0.90) / (bCount - 1) : 0;

  for (let i = 0; i < bCount; i++) {
    const x = (i - (bCount - 1) / 2) * bStepX;
    const z = (i - (bCount - 1) / 2) * bStepZ;

    for (const s of [1, -1]) {
      /* faces frente/trás */
      pushGeo(stoneGeos, new THREE.BoxGeometry(bW, bTop, bDepth),
        m.makeTranslation(x, bTop / 2, s * (halfD + bDepth / 2 - 0.02)), flat(C_PIER));
      pushGeo(stoneGeos, new THREE.ConeGeometry(bW * 0.72, 0.8, 4),
        m.makeTranslation(x, bTop + 0.4, s * (halfD + bDepth / 2 - 0.02)), flat(C_SPIRE));

      /* faces laterais */
      pushGeo(stoneGeos, new THREE.BoxGeometry(bDepth, bTop, bW),
        m.makeTranslation(s * (halfW + bDepth / 2 - 0.02), bTop / 2, z), flat(C_PIER));
      pushGeo(stoneGeos, new THREE.ConeGeometry(bW * 0.72, 0.8, 4),
        m.makeTranslation(s * (halfW + bDepth / 2 - 0.02), bTop + 0.4, z), flat(C_SPIRE));
    }
  }

  /* ── frisos horizontais ── */
  const bandCount = Math.max(2, Math.round(height / 9));
  for (let i = 0; i < bandCount; i++) {
    const y = height * (0.20 + (i / bandCount) * 0.66);
    pushGeo(stoneGeos, new THREE.BoxGeometry(width + 0.5, 0.22, depth + 0.5),
      m.makeTranslation(0, y, 0), flat(C_BAND));
  }

  /* ── cornija dupla com pingadeira ── */
  pushGeo(stoneGeos, new THREE.BoxGeometry(width + 0.55, 0.35, depth + 0.55),
    m.makeTranslation(0, height + 0.17, 0), flat(C_ROOF));
  pushGeo(stoneGeos, new THREE.BoxGeometry(width + 0.95, 0.28, depth + 0.95),
    m.makeTranslation(0, height + 0.48, 0), flat(C_BAND));
  const parapetH = 0.6;
  pushGeo(stoneGeos, new THREE.BoxGeometry(width + 0.2, parapetH, depth + 0.2),
    m.makeTranslation(0, height + 0.62 + parapetH / 2, 0), flat(C_ROOF));
  const roofY = height + 0.62 + parapetH;

  /* pináculos nos cantos do parapeito */
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const px = sx * (halfW - 0.1), pz = sz * (halfD - 0.1);
    pushGeo(stoneGeos, new THREE.BoxGeometry(0.4, 0.5, 0.4),
      m.makeTranslation(px, roofY + 0.25, pz), flat(C_ROOF));
    pushGeo(stoneGeos, new THREE.ConeGeometry(0.26, 1.3, 6),
      m.makeTranslation(px, roofY + 1.15, pz), flat(C_SPIRE));
  }

  if (cfg.style !== 'slab') {
    /* ── coroa de agulhas: mais numerosas e mais finas ── */
    const nx = cfg.spireCols;
    const nz = depth > 7.5 ? 2 : 1;
    const stepX = nx > 1 ? (width * 0.78) / (nx - 1) : 0;
    const stepZ = nz > 1 ? (depth * 0.50) / (nz - 1) : 0;
    const radius = Math.min(width / nx, depth / nz) * 0.32;

    for (let ix = 0; ix < nx; ix++) {
      for (let iz = 0; iz < nz; iz++) {
        const x = (ix - (nx - 1) / 2) * stepX;
        const z = (iz - (nz - 1) / 2) * stepZ;
        const half = Math.max((nx - 1) / 2, 0.001);
        const centerBias = 1.0 - Math.abs(ix - (nx - 1) / 2) / half;
        const sh = cfg.spireHeight * (0.50 + 0.50 * centerBias) * (0.85 + rng() * 0.35);

        /* tambor + colarinho na base da agulha */
        pushGeo(stoneGeos, new THREE.BoxGeometry(radius * 1.9, 0.7, radius * 1.9),
          m.makeTranslation(x, roofY + 0.35, z), flat(C_ROOF));
        pushGeo(stoneGeos, new THREE.BoxGeometry(radius * 2.3, 0.18, radius * 2.3),
          m.makeTranslation(x, roofY + 0.72, z), flat(C_BAND));
        pushGeo(stoneGeos, new THREE.ConeGeometry(radius, sh, 6),
          m.makeTranslation(x, roofY + 0.8 + sh / 2, z), flat(C_SPIRE));
      }
    }

    /* ── torretas de canto ── */
    const tW = Math.min(width, depth) * 0.15;
    const tH = height * (0.94 + rng() * 0.14);
    const tSpire = cfg.spireHeight * 1.15;
    const corners = [
      [-halfW - tW * 0.35, -halfD - tW * 0.35],
      [ halfW + tW * 0.35, -halfD - tW * 0.35],
      [-halfW - tW * 0.35,  halfD + tW * 0.35],
      [ halfW + tW * 0.35,  halfD + tW * 0.35],
    ];
    for (const [tx, tz] of corners) {
      pushGeo(stoneGeos, new THREE.BoxGeometry(tW, tH, tW),
        m.makeTranslation(tx, tH / 2, tz), flat(C_BODY));
      pushGeo(stoneGeos, new THREE.BoxGeometry(tW * 1.35, 0.22, tW * 1.35),
        m.makeTranslation(tx, tH + 0.11, tz), flat(C_BAND));
      pushGeo(stoneGeos, new THREE.ConeGeometry(tW * 0.72, tSpire, 6),
        m.makeTranslation(tx, tH + 0.22 + tSpire / 2, tz), flat(C_SPIRE));
    }
  } else {
    /* ── topo chapado: ameias + frontão ── */
    const nBattle = Math.max(3, Math.floor(width / 1.5));
    const gap = width / nBattle;
    for (let i = 0; i < nBattle; i++) {
      const x = (i - (nBattle - 1) / 2) * gap;
      for (const z of [-halfD, halfD]) {
        pushGeo(stoneGeos, new THREE.BoxGeometry(gap * 0.5, 0.75, 0.45),
          m.makeTranslation(x, roofY + 0.37, z), flat(C_ROOF));
      }
    }
    if (rng() > 0.4) {
      pushGeo(stoneGeos, gableGeometry(width * 0.82, height * 0.16, depth * 0.9),
        m.makeTranslation(0, roofY, 0), flat(C_ROOF));
    }
  }

  /* ── JANELAS: nicho recuado + lanceta + peitoril + halo ── */
  const winW = 0.28, winH = 1.25, rowSpacing = 2.0;
  const rows = Math.max(2, Math.floor((height - 3.0) / rowSpacing));
  const colSpacing = (width * 0.62) / Math.max(cols - 1, 1);
  const colorFn = windowColorFn(winH);
  const offFn = flat(C_OFF);
  const reveal = flat(C_REVEAL);

  /* a lanceta e seu nicho, replicados nas 4 faces */
  const face = (rot, px, py, pz, nx, nz, scale, lit) => {
    const sw = winW * scale, sh = winH * scale;
    const R = (dx, dy, dz) => new THREE.Matrix4().makeRotationY(rot)
      .setPosition(px + nx * dz, py + dy, pz + nz * dz);

    /* nicho: painel escuro embutido na parede */
    pushGeo(stoneGeos, new THREE.BoxGeometry(sw * 2.0, sh * 1.35, 0.22),
      R(0, sh * 0.45, -0.06), reveal);
    /* peitoril saliente */
    pushGeo(stoneGeos, new THREE.BoxGeometry(sw * 2.4, 0.14, 0.34),
      R(0, -0.12, 0.06), flat(C_BAND));
    /* arco superior */
    pushGeo(stoneGeos, new THREE.BoxGeometry(sw * 2.3, 0.16, 0.30),
      R(0, sh * 1.12, 0.04), flat(C_BAND));

    pushGeo(winGeos, lancetShape(sw, sh), R(0, 0, 0.08), lit ? colorFn : offFn);

    if (lit) {
      const halo = new THREE.PlaneGeometry(sw * 5.5, sh * 2.6);
      pushGeo(haloGeos, halo, R(0, sh * 0.5, 0.13), flat(C_HALO));
    }
  };

  for (let row = 0; row < rows; row++) {
    const y = 3.0 + row * rowSpacing;
    if (y > height - 1.6) break;

    for (let col = 0; col < cols; col++) {
      const off = (col - (cols - 1) / 2) * colSpacing;
      const zOff = off * (depth / width);

      face(0,          off,  y,  halfD,  0,  1, 1.0, rng() > 0.20);
      face(Math.PI,   -off,  y, -halfD,  0, -1, 1.0, rng() > 0.20);
      if (width > 6) {
        face( Math.PI / 2,  halfW, y, -zOff,  1, 0, 0.9, rng() > 0.26);
        face(-Math.PI / 2, -halfW, y,  zOff, -1, 0, 0.9, rng() > 0.26);
      }
    }
  }

  const group = new THREE.Group();
  group.add(new THREE.Mesh(mergeGeometries(stoneGeos), STONE_MAT));
  if (winGeos.length)  group.add(new THREE.Mesh(mergeGeometries(winGeos), WINDOW_MAT));
  if (haloGeos.length) {
    const haloMesh = new THREE.Mesh(mergeGeometries(haloGeos), HALO_MAT);
    haloMesh.renderOrder = 5;
    group.add(haloMesh);
  }

  /* espuma e respingo acompanham a base da torre */
  const wash = new THREE.Mesh(buildWashGeometry(width + 0.7, depth + 0.7), WASH_MAT);
  wash.renderOrder = 6;
  group.add(wash);

  const spray = new THREE.Mesh(buildSprayGeometry(width + 0.7, depth + 0.7), SPRAY_MAT);
  spray.renderOrder = 7;
  group.add(spray);

  return group;
}

/* ═════════════════════════════════════════════
   12. GERAÇÃO DA CIDADE
   ═════════════════════════════════════════════ */
const CHANNEL_WIDTH    = 26;
const TOWER_SPACING_Z  = 15;
const BACK_ROW_OFFSET  = 15;
const CHUNK_SIZE       = 180;
const CHUNKS_AHEAD     = 4;
const CHUNKS_BEHIND    = 1;
const TOWERS_PER_CHUNK = Math.round(CHUNK_SIZE / TOWER_SPACING_Z);

const towerConfigs = [
  { width: 7.0,  depth: 7.0, height: 22, spireHeight: 9,  spireCols: 3, windowCols: 3, style: 'spired' },
  { width: 5.5,  depth: 5.5, height: 17, spireHeight: 7,  spireCols: 3, windowCols: 2, style: 'spired' },
  { width: 9.0,  depth: 8.0, height: 30, spireHeight: 12, spireCols: 4, windowCols: 4, style: 'spired' },
  { width: 6.0,  depth: 6.0, height: 14, spireHeight: 6,  spireCols: 3, windowCols: 2, style: 'spired' },
  { width: 8.0,  depth: 7.5, height: 26, spireHeight: 11, spireCols: 4, windowCols: 3, style: 'spired' },
  { width: 4.5,  depth: 4.5, height: 12, spireHeight: 5,  spireCols: 2, windowCols: 2, style: 'spired' },
  { width: 10.0, depth: 9.0, height: 36, spireHeight: 15, spireCols: 5, windowCols: 4, style: 'spired' },
  { width: 6.5,  depth: 5.0, height: 13, spireHeight: 0,  spireCols: 0, windowCols: 2, style: 'slab' },
  { width: 8.5,  depth: 5.5, height: 18, spireHeight: 0,  spireCols: 0, windowCols: 3, style: 'slab' },
];

const generatedChunks = new Map();
const chunkKey = (cx, cz) => `${cx},${cz}`;

/* As torres agora carregam bem mais geometria, então
   cada (config, variante) é montada UMA vez e reusada
   via clone() — clone compartilha geometria e material,
   o que mantém a geração de chunk barata. */
const VARIANTS = 4;
const towerProtos = new Map();

function getTowerProto(cfgIndex, variant) {
  const key = `${cfgIndex}:${variant}`;
  let proto = towerProtos.get(key);
  if (!proto) {
    proto = buildTower(towerConfigs[cfgIndex], mulberry32(cfgIndex * 7919 + variant * 104729));
    towerProtos.set(key, proto);
  }
  return proto;
}

function placeTower(chunk, cfgIndex, x, z, rng) {
  const tower = getTowerProto(cfgIndex, Math.floor(rng() * VARIANTS)).clone();
  tower.position.set(x, 0, z);
  tower.rotation.y = (rng() - 0.5) * 0.12;
  chunk.add(tower);
}

function generateChunk(cx, cz) {
  const key = chunkKey(cx, cz);
  if (generatedChunks.has(key)) return;

  const chunk = new THREE.Group();
  const rng = mulberry32((cz * 73856093) ^ (cx * 19349663) ^ 0x9e3779b9);

  for (const side of [1, -1]) {
    for (let i = 0; i < TOWERS_PER_CHUNK; i++) {
      const z = cz * CHUNK_SIZE + i * TOWER_SPACING_Z + (rng() - 0.5) * 4;

      if (rng() > 0.10) {
        const ci = Math.floor(rng() * towerConfigs.length);
        const x = side * (CHANNEL_WIDTH / 2 + towerConfigs[ci].width / 2 + rng() * 2.5);
        placeTower(chunk, ci, x, z, rng);
      }

      if (rng() > 0.35) {
        const ci = Math.floor(rng() * towerConfigs.length);
        const x = side * (CHANNEL_WIDTH / 2 + BACK_ROW_OFFSET + towerConfigs[ci].width / 2 + rng() * 6);
        placeTower(chunk, ci, x, z + TOWER_SPACING_Z * 0.5, rng);
      }
    }
  }

  scene.add(chunk);
  generatedChunks.set(key, chunk);
}

/* geometria é compartilhada com os protótipos: só remover */
function removeChunk(cx, cz) {
  const key = chunkKey(cx, cz);
  const chunk = generatedChunks.get(key);
  if (!chunk) return;
  scene.remove(chunk);
  generatedChunks.delete(key);
}

/* ═════════════════════════════════════════════
   13. LOOP
   ═════════════════════════════════════════════ */
let cameraX = 0, cameraY = 2.6, cameraZ = 30;
const FORWARD_SPEED = 4.2;
let elapsed = 0;

const clock = new THREE.Clock();
const wind = new THREE.Vector2(3.0, 0.6);
const camPos = new THREE.Vector3();

function updateChunks() {
  const current = Math.floor(cameraZ / CHUNK_SIZE);
  for (let cz = current - CHUNKS_AHEAD; cz <= current + CHUNKS_BEHIND; cz++) {
    generateChunk(0, cz);
  }
  for (const key of [...generatedChunks.keys()]) {
    const [cx, cz] = key.split(',').map(Number);
    if (cz > current + CHUNKS_BEHIND || cz < current - CHUNKS_AHEAD - 1) {
      removeChunk(cx, cz);
    }
  }
}
updateChunks();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  /* rajadas: a inclinação da chuva muda devagar */
  wind.set(
    3.2 + Math.sin(elapsed * 0.11) * 2.4 + Math.sin(elapsed * 0.37) * 0.8,
    0.5 + Math.cos(elapsed * 0.08) * 1.6
  );

  cameraZ -= FORWARD_SPEED * dt;
  cameraX = Math.sin(elapsed * 0.13) * 1.6;

  const h = surfaceHeight(cameraX, cameraZ, elapsed);
  cameraY = 2.7 + h * 0.55;

  camPos.set(cameraX, cameraY, cameraZ);
  camera.position.copy(camPos);
  camera.lookAt(cameraX * 0.3, cameraY + 1.7, cameraZ - 60);
  camera.rotation.z = Math.sin(elapsed * 0.21) * 0.014;

  water.position.set(cameraX, 0, cameraZ);

  U.uTime.value = elapsed;

  for (const layer of rainLayers) {
    layer.material.uniforms.uCamPos.value.copy(camPos);
    layer.material.uniforms.uWind.value.copy(wind);
  }

  updateStorm(dt, camPos);

  if (Math.floor(elapsed * 2) !== Math.floor((elapsed - dt) * 2)) updateChunks();

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
